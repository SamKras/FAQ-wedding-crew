// ─── State ───────────────────────────────────────────────────────────────────
let lang = 'ru';
let activeTab = 'all';
let project = 'lero';

// ─── Render ──────────────────────────────────────────────────────────────────
// ─── Travel fee calculator widget (read-only, backed by an Apps Script Web App) ──
const FEE_CALC_API = 'https://script.google.com/macros/s/AKfycby8k74g_h4UC1hY5shl3OfX6dx6ar2Tft-QHq--9AoZYGX8kEbwXMNY6IYhdGFsOm8X/exec';

function loadFeeCalcNames(selectEl) {
  if (selectEl.dataset.loaded === '1' || selectEl.dataset.loading === '1') return;
  selectEl.dataset.loading = '1';
  fetch(FEE_CALC_API + '?action=names')
    .then(r => r.json())
    .then(data => {
      const names = (data && data.names) || [];
      names.forEach(n => {
        const opt = document.createElement('option');
        opt.value = n;
        opt.textContent = n;
        selectEl.appendChild(opt);
      });
      selectEl.dataset.loaded = '1';
      selectEl.dataset.loading = '0';
    })
    .catch(() => {
      selectEl.dataset.loading = '0';
    });
}

function setFeeCalcMode(btn) {
  const wrap = btn.closest('.fee-calc-box');
  const mode = btn.dataset.mode;
  wrap.querySelectorAll('.fee-calc-mode-btn').forEach(b => {
    const active = b === btn;
    b.classList.toggle('active', active);
    b.style.background = active ? '#1a1a1a' : '#fff';
    b.style.color = active ? '#fff' : '#555';
  });
  wrap.querySelector('.fee-calc-name').style.display = mode === 'name' ? '' : 'none';
  wrap.querySelector('.fee-calc-origin').style.display = mode === 'address' ? '' : 'none';
  wrap.querySelector('.fee-calc-result').innerHTML = '';
}

function calcTravelFeeWidget(btn) {
  const wrap = btn.closest('.fee-calc-box');
  const nameSel = wrap.querySelector('.fee-calc-name');
  const destInput = wrap.querySelector('.fee-calc-dest');
  const originInput = wrap.querySelector('.fee-calc-origin');
  const activeModeBtn = wrap.querySelector('.fee-calc-mode-btn.active');
  const mode = activeModeBtn ? activeModeBtn.dataset.mode : 'name';
  const resultBox = wrap.querySelector('.fee-calc-result');
  const name = mode === 'name' ? nameSel.value : '';
  const originAddress = mode === 'address' ? originInput.value.trim() : '';
  const destination = destInput.value.trim();
  const calcLang = wrap.dataset.lang;

  const msgs = {
    ru: {
      selectName: 'Выберите исполнителя из списка.',
      enterOrigin: 'Введите ваш адрес.',
      enterAddress: 'Введите адрес локации.',
      loading: 'Считаем...',
      error: 'Не удалось рассчитать. Проверьте адрес и попробуйте снова.',
      notFound: 'Исполнитель не найден.',
      noAddress: 'У этого исполнителя не указан адрес.',
      result: (miles, fee) => `Расстояние в одну сторону: <strong>${miles} миль</strong><br>Тревел-фи: <strong>$${fee}</strong>`
    },
    en: {
      selectName: 'Please select your name from the list.',
      enterOrigin: 'Please enter your address.',
      enterAddress: 'Please enter the venue address.',
      loading: 'Calculating...',
      error: 'Could not calculate. Please check the address and try again.',
      notFound: 'Crew member not found.',
      noAddress: 'No address on file for this crew member.',
      result: (miles, fee) => `One-way distance: <strong>${miles} mi</strong><br>Travel fee: <strong>$${fee}</strong>`
    }
  };
  const t = msgs[calcLang] || msgs.ru;

  if (mode === 'name' && !name) { resultBox.innerHTML = t.selectName; return; }
  if (mode === 'address' && !originAddress) { resultBox.innerHTML = t.enterOrigin; return; }
  if (!destination) { resultBox.innerHTML = t.enterAddress; return; }

  resultBox.innerHTML = t.loading;

  const nameOrOriginParam = mode === 'address'
    ? '&origin=' + encodeURIComponent(originAddress)
    : '&name=' + encodeURIComponent(name);
  fetch(FEE_CALC_API + '?action=calc&destination=' + encodeURIComponent(destination) + nameOrOriginParam)
    .then(r => r.json())
    .then(data => {
      if (!data || data.error === 'executor_not_found') { resultBox.innerHTML = t.notFound; return; }
      if (data.error === 'no_address_on_file') { resultBox.innerHTML = t.noAddress; return; }
      if (data.error) { resultBox.innerHTML = t.error; return; }
      resultBox.innerHTML = t.result(data.distanceMiles, data.fee);
    })
    .catch(() => { resultBox.innerHTML = t.error; });
}

function render() {
  const d = DATA[lang];
  const app = document.getElementById('app');

  const tabsHTML = d.tabs.map(t =>
    `<button class="tab-btn${activeTab === t.id ? ' active' : ''}" data-tab="${t.id}">${t.label}</button>`
  ).join('');

  const sectionsHTML = d.sections.map(sec => {
    const itemsHTML = sec.items.map((item, i) => {
      const answer = typeof item.a === 'function' ? item.a(project) : item.a;
      return `<div class="faq-item" data-section="${sec.id}" data-idx="${i}">
        <button class="faq-question">
          <span>${item.q}</span>
          <span class="icon">+</span>
        </button>
        <div class="faq-answer">${answer}</div>
      </div>`;
    }).join('');

    const hidden = activeTab !== 'all' && activeTab !== sec.id ? ' hidden' : '';
    return `<div class="faq-section${hidden}" data-section="${sec.id}">
      <div class="section-title">${sec.title}</div>
      ${itemsHTML}
    </div>`;
  }).join('');

  app.innerHTML = `
    <div class="company-header">
      <div class="company-header-logo">LERO <span>movie</span><span class="sep">×</span>VOWS <span>studio</span></div>
      <div class="company-header-tagline">${d.companyTagline}</div>
    </div>
    <div class="project-bar">
      <span class="project-bar-label">${d.projectLabel}</span>
      <div class="project-toggle">
        <button class="project-btn active" id="project-lero">Lero Movie</button>
        <button class="project-btn" id="project-vows">VOWS studio</button>
      </div>
    </div>
    <div class="top-bar">
      <div>
        <h1>${d.title}</h1>
        <p>${d.subtitle}</p>
      </div>
      <div class="lang-toggle">
        <button class="lang-btn active" id="lang-ru">RU</button>
        <button class="lang-btn" id="lang-en">EN</button>
      </div>
    </div>
    <div class="search-wrapper">
      <input type="text" id="search" placeholder="${d.searchPlaceholder}" autocomplete="off" value="">
    </div>
    <div class="tabs">${tabsHTML}</div>
    ${sectionsHTML}
    <p class="no-results" id="no-results">${d.noResults}</p>
  `;

  document.getElementById('lang-ru').classList.toggle('active', lang === 'ru');
  document.getElementById('lang-en').classList.toggle('active', lang === 'en');
  document.getElementById('project-lero').classList.toggle('active', project === 'lero');
  document.getElementById('project-vows').classList.toggle('active', project === 'vows');

  bindEvents();
}

// ─── Events ──────────────────────────────────────────────────────────────────
function bindEvents() {
  document.querySelectorAll('.faq-question').forEach(btn => {
    btn.addEventListener('click', () => {
      const item = btn.closest('.faq-item');
      const isOpen = item.classList.contains('open');
      document.querySelectorAll('.faq-item.open').forEach(i => i.classList.remove('open'));
      if (!isOpen) item.classList.add('open');
    });
  });

  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      activeTab = btn.dataset.tab;
      document.getElementById('search').value = '';
      render();
    });
  });

  document.getElementById('search').addEventListener('input', function () {
    const q = this.value.toLowerCase().trim();

    if (q) {
      activeTab = 'all';
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      const allBtn = document.querySelector('[data-tab="all"]');
      if (allBtn) allBtn.classList.add('active');
      document.querySelectorAll('.faq-section').forEach(s => s.classList.remove('hidden'));
    }

    let anyVisible = false;
    document.querySelectorAll('.faq-item').forEach(item => {
      const qText = item.querySelector('.faq-question').textContent.toLowerCase();
      const aText = item.querySelector('.faq-answer').textContent.toLowerCase();
      const match = !q || qText.includes(q) || aText.includes(q);
      item.classList.toggle('hidden', !match);
      if (match) anyVisible = true;
    });

    document.getElementById('no-results').style.display = (q && !anyVisible) ? 'block' : 'none';
  });

  document.getElementById('lang-ru').addEventListener('click', () => {
    if (lang !== 'ru') { lang = 'ru'; activeTab = 'all'; render(); }
  });
  document.getElementById('lang-en').addEventListener('click', () => {
    if (lang !== 'en') { lang = 'en'; activeTab = 'all'; render(); }
  });

  document.getElementById('project-lero').addEventListener('click', () => {
    if (project !== 'lero') { project = 'lero'; render(); }
  });
  document.getElementById('project-vows').addEventListener('click', () => {
    if (project !== 'vows') { project = 'vows'; render(); }
  });
}

render();
</script>
